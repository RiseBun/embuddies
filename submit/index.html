<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发布硬件项目 | embuddies</title><meta name="description" content="发布你的硬件作品，填写制作资料与来源。"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/workshop.css"><script type="module" src="/submit/page.js"></script></head>
<body id="top"><a class="skip" href="#main">跳至正文</a><div class="wrap"><header><a class="logo" href="/" aria-label="embuddies 首页"><img src="/assets/embuddies-logo.jpg" alt="embuddies" width="186" height="57"></a><nav aria-label="主导航"><a href="/">首页</a><a href="/projects/">硬件项目</a><a href="/updates/">最新资讯</a><a href="/kits/">套件</a><a href="/hackathon/">黑客松</a><a href="/community/">社区</a><a href="/submit/" aria-current="page">发布项目</a><a href="/about/">关于我们</a></nav></header>
<main id="main"><div class="page-heading submit-heading"><div class="eyebrow" data-zh="创作者" data-en="Creators">创作者</div><h1 data-zh="发布你的硬件项目。" data-en="Publish your hardware project.">发布你的硬件项目。</h1><p data-zh="作品展示与开源项目都可以发布。请使用自己有权分享的图片与资料；新项目由人工审核。" data-en="Showcase and open-source projects are welcome. Share only media and resources you have permission to use. New projects are reviewed before publication.">作品展示与开源项目都可以发布。请使用自己有权分享的图片与资料；新项目由人工审核。</p></div>
<p id="service-status" class="form-message" role="status" aria-live="polite"></p><section id="submission-fallback" class="section planning-layout" hidden><h2 data-zh="提交作品" data-en="Submit your work">提交作品</h2><div><p data-zh="账号投稿尚未开放。现在可以通过 GitHub 提交项目资料；我们审核后将其加入目录。" data-en="Account publishing is not open yet. Submit project details through GitHub; we review them before adding them to the directory.">账号投稿尚未开放。现在可以通过 GitHub 提交项目资料；我们审核后将其加入目录。</p><a class="button" href="https://github.com/RiseBun/embuddies/issues/new" target="_blank" rel="noopener noreferrer" data-zh="通过 GitHub 投稿 ↗" data-en="Submit on GitHub ↗">通过 GitHub 投稿 ↗</a></div></section>
<section id="auth-section" class="section auth-section" hidden><h2 data-zh="登录后开始" data-en="Sign in to begin">登录后开始</h2><form id="auth-form" class="auth-form"><label><span data-zh="邮箱" data-en="Email">邮箱</span><input name="email" type="email" autocomplete="email" required></label><button class="button" type="submit" data-zh="发送登录链接" data-en="Send sign-in link">发送登录链接</button></form></section>
<div id="creator-workspace" hidden><div class="workspace-toolbar"><span id="signed-in-as"></span><button class="text-button" id="sign-out" type="button" data-zh="退出登录" data-en="Sign out">退出登录</button></div><section class="section workspace-list"><div class="heading"><h2 data-zh="我的项目" data-en="My projects">我的项目</h2><button class="button ghost" id="new-project" type="button" data-zh="新建项目" data-en="New project">新建项目</button></div><div id="my-projects"></div></section>
<section class="section submission-section" id="project-editor" hidden><h2 id="editor-title" data-zh="项目资料" data-en="Project details">项目资料</h2><form id="project-form" class="project-form"><div class="form-grid"><label><span data-zh="项目名称 *" data-en="Project name *">项目名称 *</span><input name="title" minlength="2" maxlength="100" required></label><label><span data-zh="作者或团队 *" data-en="Creator or team *">作者或团队 *</span><input name="author" minlength="2" maxlength="100" required></label><label><span data-zh="硬件类型 *" data-en="Hardware type *">硬件类型 *</span><select name="category" required></select></label><label><span data-zh="开放程度 *" data-en="Openness *">开放程度 *</span><select name="openness" required></select></label><label><span data-zh="制作状态 *" data-en="Build readiness *">制作状态 *</span><select name="readiness" required></select></label><label><span data-zh="许可链接" data-en="License link">许可链接</span><input name="licenseUrl" type="url" placeholder="https://"></label></div>
<div class="form-grid"><label><span data-zh="中文简介" data-en="Chinese description">中文简介</span><textarea name="descriptionZh" rows="3" maxlength="600"></textarea></label><label><span data-zh="English description" data-en="English description">English description</span><textarea name="descriptionEn" rows="3" maxlength="600"></textarea></label><label><span data-zh="中文制作说明" data-en="Chinese build notes">中文制作说明</span><textarea name="buildNotesZh" rows="3" maxlength="1000"></textarea></label><label><span data-zh="English build notes" data-en="English build notes">English build notes</span><textarea name="buildNotesEn" rows="3" maxlength="1000"></textarea></label></div>
<label><span data-zh="零件或材料（每行一项）" data-en="Parts or materials (one per line)">零件或材料（每行一项）</span><textarea name="materials" rows="5" maxlength="4000"></textarea></label><label><span data-zh="项目图片（JPG、PNG、WebP，最多 5 MB）" data-en="Project image (JPG, PNG, WebP, up to 5 MB)">项目图片（JPG、PNG、WebP，最多 5 MB）</span><input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="current-image" class="sub"></div>
<div class="heading resource-heading"><h3 data-zh="外部资料" data-en="External resources">外部资料</h3><button id="add-resource" type="button" class="button ghost" data-zh="添加链接" data-en="Add link">添加链接</button></div><div id="resource-fields"></div><p class="sub" data-zh="代码、CAD、模型继续保存在原平台。这里只记录 HTTPS 链接。" data-en="Code, CAD and models stay on their original hosts. Add HTTPS links here.">代码、CAD、模型继续保存在原平台。这里只记录 HTTPS 链接。</p>
<label class="rights-check"><input name="rightsConfirmed" type="checkbox"><span data-zh="我有权分享以上图片与资料，并确认开放程度标注准确。" data-en="I have permission to share these images and resources, and the openness label is accurate.">我有权分享以上图片与资料，并确认开放程度标注准确。</span></label><div class="form-actions"><button class="button ghost" id="save-draft" type="submit" formnovalidate data-action="draft" data-zh="保存草稿" data-en="Save draft">保存草稿</button><button class="button" id="send-review" type="submit" data-action="pending" data-zh="提交审核" data-en="Send for review">提交审核</button></div></form></section></div>
</main><footer><a class="logo" href="/" aria-label="embuddies 首页"><img src="/assets/embuddies-logo.jpg" alt="embuddies" width="186" height="57"></a><p>embodied + buddies · © 2026 embuddies</p><a href="#top">回到顶部 ↑</a></footer></div></body></html>
